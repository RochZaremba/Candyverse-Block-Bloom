name: candyverse
description: Offline candy block puzzle and island game for Android.
publish_to: none
version: 1.3.0+6

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
  assets:
    - assets/design_tokens.json
    - assets/audio/
    - assets/privacy/
    - assets/kingdom/
