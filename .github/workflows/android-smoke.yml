name: Android smoke
on:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'scripts/android_smoke.sh'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Twenty minutes of active Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CANDYVERSE_SMOKE_MINUTES: '20'
          CANDYVERSE_QA_OUTPUT: build/qa-smoke
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: scripts/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api36
          path: build/qa-smoke/
          if-no-files-found: warn
          retention-days: 14
