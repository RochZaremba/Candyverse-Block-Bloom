name: Android smoke
on:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'scripts/android_smoke.sh'
      - 'scripts/capture_android_milestones.py'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
    inputs:
      active_minutes:
        description: '20 = full active QA; 0 = UI evidence diagnostic only'
        type: choice
        default: '20'
        options: ['20', '0']
concurrency:
  group: android-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android QA (20 minutes by default; optional UI diagnostic)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CANDYVERSE_SMOKE_MINUTES: ${{ inputs.active_minutes || '20' }}
          CANDYVERSE_SOFTWARE_RENDERING: '1'
          CANDYVERSE_QA_OUTPUT: build/qa-smoke
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan,GLDirectMem -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: scripts/android_smoke.sh
      - name: Record runner diagnostics
        if: always()
        run: |
          mkdir -p build/qa-smoke
          free -m > build/qa-smoke/runner-memory.txt
          sudo dmesg --color=never | tail -n 200 > build/qa-smoke/runner-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api35
          path: build/qa-smoke/
          if-no-files-found: warn
          retention-days: 14
