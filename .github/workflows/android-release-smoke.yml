name: Signed Android compatibility
on:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/settings/**'
      - 'assets/privacy/**'
      - 'public_pages/**'
      - 'scripts/android_release_smoke.py'
      - '.github/workflows/android-release-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-entrypoint:
    # GitHub requires push access to read private draft release candidates.
    # Only the download step receives GH_TOKEN; signing material stays local.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: google_apis
            page-size: 4096
            ram: 2048
          - api: 36
            target: google_apis
            page-size: 4096
            ram: 2048
          - api: 35
            target: google_apis_ps16k
            page-size: 16384
            ram: 4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download signed candidate without signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release-qa
          gh release download v1.0.0-rc.1 --repo "$GITHUB_REPOSITORY" --pattern candyverse-1.0.0-1.apk --dir build/release-qa
          echo '50623133b59a7aa68544c0bef6df13d060ce8c721e088296d255bdb34d911825  build/release-qa/candyverse-1.0.0-1.apk' | sha256sum --check
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: ${{ matrix.ram }}
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 440
            adb shell input keyevent WAKEUP
            adb shell input keyevent 82
            sleep 5
            python3 scripts/android_release_smoke.py build/release-qa/candyverse-1.0.0-1.apk --output build/release-qa/results --expected-page-size ${{ matrix.page-size }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-api${{ matrix.api }}-pages${{ matrix.page-size }}
          path: build/release-qa/results/
          if-no-files-found: warn
          retention-days: 14
